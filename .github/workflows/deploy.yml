name: Deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          init-shell: bash
          environment-name: jupyterlite-env
          create-args: python=3.11 jupyterlite-core=0.8.6 jupyterlite-xeus jupyter_server

      - name: Build JupyterLite
        shell: bash -l {0}
        run: |
          jupyter lite build \
            --contents contents \
            --output-dir _output \
            --XeusAddon.environment_file=environment.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output

      - id: deployment
        uses: actions/deploy-pages@v4
