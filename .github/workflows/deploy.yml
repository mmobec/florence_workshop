
name: Deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JupyterLite with package locking
        run: |
          python -m pip install \
            "jupyterlite-core==0.8.6" \
            "jupyterlite-pyodide-kernel[lock]==0.8.6" \
            jupyter-server

      - name: Build JupyterLite
        run: jupyter lite build --contents contents --output-dir _output

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output

      - id: deployment
        uses: actions/deploy-pages@v4
